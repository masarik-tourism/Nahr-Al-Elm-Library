name: Deploy Web OTA & Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Job 1: Build & Deploy Web Frontend & PWA for Over-The-Air (OTA) Updates
  # =========================================================================
  deploy-web-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Web Assets for Live Hosting
        run: |
          mkdir -p dist/icons
          cp index.html dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp -r icons/* dist/icons/ 2>/dev/null || true
          cp icon-192.png dist/ 2>/dev/null || true
          cp icon-512.png dist/ 2>/dev/null || true
          touch dist/.nojekyll
          ls -lah dist/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true

  # =========================================================================
  # Job 2: Compile Native Android APK & Publish to GitHub Releases
  # =========================================================================
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Required for AGP 9.1.1)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK Permissions, Licenses & Platform 36
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "Using Android SDK at: $SDK_DIR"

          sudo chown -R "$USER:$USER" /usr/local/lib/android 2>/dev/null || true
          sudo chown -R "$USER:$USER" "$SDK_DIR" 2>/dev/null || true

          mkdir -p "$SDK_DIR/licenses"
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
          8933bad161af65ca73a1087504732095514b2482
          d56f5187479451eabf01fb78ba6ed6ee3245d2d6
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat << 'EOF' > "$SDK_DIR/licenses/google-gdk-license"
          33b6a2b64607f11b759f320ef9dff4ae5c47d97a
          EOF

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi
          ls -lah "$SDK_DIR/platforms" 2>/dev/null || true

      - name: Restore Consistent Signing Keystore (Zero Mismatch)
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Restoring pinned consistent debug.keystore from CI fallback..."
              cat << 'KEYEOF' | tr -d '\n ' | base64 -d > debug.keystore
          
          KEYEOF
            fi
          fi
          keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep -E "Alias|SHA1:|SHA256:" || true
          ls -lah debug.keystore

      - name: Ensure Secrets and Config Files Exist
        run: |
          touch .env
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "nahralelm-app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.nahralelm.bkzq"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Sync Web Assets into Android Assets Folder
        run: |
          mkdir -p app/src/main/assets/icons
          cp -f index.html app.js sw.js manifest.json app/src/main/assets/
          cp -f icon-192.png icon-512.png app/src/main/assets/ 2>/dev/null || true
          cp -rf icons/* app/src/main/assets/icons/ 2>/dev/null || true
          ls -lah app/src/main/assets/

      - name: Compile Native Android APK (assembleDebug)
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2
          else
            gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2
          fi

      - name: Locate, Verify Signature & Package APK Artifact
        run: |
          mkdir -p build-output
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          test -f "$APK_SOURCE"
          cp -f "$APK_SOURCE" build-output/Nahr-Al-Elm-Library.apk

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -1 "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          if [ -n "$BT" ] && [ -x "$SDK_DIR/build-tools/$BT/apksigner" ]; then
            "$SDK_DIR/build-tools/$BT/apksigner" verify --verbose --print-certs build-output/Nahr-Al-Elm-Library.apk
            "$SDK_DIR/build-tools/$BT/zipalign" -c 4 build-output/Nahr-Al-Elm-Library.apk
          fi
          ls -lah build-output/

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nahr-Al-Elm-Library-Android-APK
          path: build-output/Nahr-Al-Elm-Library.apk
          retention-days: 30
          if-no-files-found: error

      - name: Host Direct APK on GitHub Pages Fastly CDN
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p pages-apk
          cp -f build-output/Nahr-Al-Elm-Library.apk pages-apk/Nahr-Al-Elm-Library.apk
          ls -lh pages-apk/

      - name: Publish APK to GitHub Pages CDN
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-apk
          publish_branch: gh-pages
          keep_files: true
        continue-on-error: true

      # Attach the compiled APK directly into GitHub Release (v2.2.0)
      - name: Publish APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.ref == 'refs/heads/main'
        with:
          files: build-output/Nahr-Al-Elm-Library.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          name: "إصدار مكتبة نهر العلم - تطبيق الأندرويد ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}"
          body: |
            ### 📱 تطبيق مكتبة نهر العلم - إدارة أ/ إيهاب (الإصدار 2.2.0)
            - تقليص حجم ملف التطبيق (APK) بأكثر من 75% لتنزيل وتثبيت فائق السرعة.
            - استضافة رابط التحميل المباشر على شبكة CDN السريعة وتسريع فتح الموقع والتطبيق أضعافاً.
            - محرك التحديث التلقائي المباشر (Auto-OTA) لسحب أي تحديثات جديدة من الموقع تلقائياً عند الفتح دون إعادة تثبيت.
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
