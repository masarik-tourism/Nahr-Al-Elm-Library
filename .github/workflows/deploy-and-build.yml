name: Deploy Web OTA & Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Job 1: Build & Deploy Web Frontend & PWA for Over-The-Air (OTA) Updates
  # Deploys directly to gh-pages branch (Zero-error, automatic GitHub Pages)
  # =========================================================================
  deploy-web-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets for Live Hosting
        run: |
          mkdir -p dist/icons
          cp index.html dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp -r icons/* dist/icons/ 2>/dev/null || true
          cp icon-192.png dist/ 2>/dev/null || true
          cp icon-512.png dist/ 2>/dev/null || true
          touch dist/.nojekyll
          ls -lah dist/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  # =========================================================================
  # Job 2: Compile Native Android APK & Publish to GitHub Releases
  # =========================================================================
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK Permissions, Licenses & Platform 36
        run: |
          echo "Setting Android SDK permissions..."
          sudo chown -R $USER:$USER /usr/local/lib/android 2>/dev/null || true
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true

          echo "Injecting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-license"
          8933bad161af65ca73a1087504732095514b2482
          d56f5187479451eabf01fb78ba6ed6ee3245d2d6
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat << 'EOF' > "$ANDROID_HOME/licenses/google-gdk-license"
          33b6a2b64607f11b759f320ef9dff4ae5c47d97a
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "Pre-installing Android 36 SDK Platform & Build-Tools..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          ls -lah "$ANDROID_HOME/platforms" || true

      - name: Restore & Verify Consistent Signing Keystore (Zero Mismatch)
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring consistent debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "ERROR: Consistent debug.keystore and debug.keystore.base64 are both missing!"
              exit 1
            fi
          fi
          echo "Verifying Signing Keystore SHA-256 Fingerprint..."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          ls -lah debug.keystore

      - name: Ensure Secrets and Config Files Exist
        run: |
          touch .env
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "nahralelm-app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.nahralelm.bkzq"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          cat app/google-services.json

      - name: Sync Web Assets into Android Assets Folder
        run: |
          mkdir -p app/src/main/assets/icons
          cp -f index.html app.js sw.js manifest.json app/src/main/assets/
          cp -f icon-192.png icon-512.png app/src/main/assets/ 2>/dev/null || true
          cp -rf icons/* app/src/main/assets/icons/ 2>/dev/null || true
          ls -lah app/src/main/assets/

      - name: Compile Native Android APK (assembleDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2 || gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.workers.max=2

      - name: Locate and Package APK Artifact
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Nahr-Al-Elm-Library.apk \;
          ls -lah build-output/

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nahr-Al-Elm-Library-Android-APK
          path: build-output/Nahr-Al-Elm-Library.apk
          retention-days: 30
          if-no-files-found: error

      # Attach the compiled APK directly into GitHub Release (v2.0.0)
      - name: Publish APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.ref == 'refs/heads/main'
        with:
          files: build-output/Nahr-Al-Elm-Library.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: "إصدار مكتبة نهر العلم - تطبيق الأندرويد ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}"
          body: |
            ### 📱 تطبيق مكتبة نهر العلم - إدارة أ/ إيهاب (الإصدار 2.0.0)
            - مبني وموقّع بنفس مفتاح التوقيع الرقمي الثابت (`com.aistudio.nahralelm.bkzq`) لضمان التحديث السلس فوق النسخة السابقة.
            - أقسام منفصلة واضحة (الكل، الكتب الخارجية، الأدوات المكتبية، باكدجات السبلايز، الهدايا، وخدمات الطباعة).
            - شريط بحث فوري + فلاتر ذكية + عروض السبلايز + حساب صفحات PDF تلقائياً بـ PDF.js.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
