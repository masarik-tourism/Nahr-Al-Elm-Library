name: Deploy Web OTA & Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Job 1: Build & Deploy Web Frontend & PWA for Over-The-Air (OTA) Updates
  # Works automatically on all GitHub repositories (gh-pages branch & Actions)
  # =========================================================================
  deploy-web-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets for Live Hosting
        run: |
          mkdir -p dist/icons
          cp index.html dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp -r icons/* dist/icons/ 2>/dev/null || true
          cp icon-192.png dist/ 2>/dev/null || true
          cp icon-512.png dist/ 2>/dev/null || true
          # Create .nojekyll to ensure GitHub Pages does not ignore underscore files
          touch dist/.nojekyll
          ls -lah dist/

      # Primary deployment via GitHub Pages branch (Works 100% with zero configuration)
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      # Secondary deployment if repository has GitHub Actions Pages enabled in Settings
      - name: Upload Pages Artifact (Actions Mode)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy Pages (Actions Mode Fallback)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  # =========================================================================
  # Job 2: Compile & Package Release-Ready Native Android APK Artifact
  # =========================================================================
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2560m"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Fallback Google Services Config
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"nahralelm-app"},"client":[]}' > app/google-services.json
          fi

      - name: Sync Web Assets into Android Assets Folder
        run: |
          mkdir -p app/src/main/assets/icons
          cp -f index.html app.js sw.js manifest.json app/src/main/assets/
          cp -f icon-192.png icon-512.png app/src/main/assets/ 2>/dev/null || true
          cp -rf icons/* app/src/main/assets/icons/ 2>/dev/null || true
          ls -lah app/src/main/assets/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile Native Android APK (assembleDebug)
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Package APK Artifact
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Nahr-Al-Elm-Library.apk \;
          ls -lah build-output/

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nahr-Al-Elm-Library-Android-APK
          path: build-output/Nahr-Al-Elm-Library.apk
          retention-days: 30
          if-no-files-found: error
